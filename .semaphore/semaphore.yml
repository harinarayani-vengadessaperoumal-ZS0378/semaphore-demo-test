version: v1.0
name: Python
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2204
blocks:
  - name: Installation
    task:
      jobs:
        - name: Install robot framework dependencies
          commands:
            - sem-version python 3.12
            - checkout
            - python -m pip install --upgrade pip
            - pip install -r selenium-web-pom/requirements.txt
            - chmod +x run.sh
            - ./run.sh
            - artifact push workflow selenium-web-pom/test-results/report.html
            - artifact push workflow selenium-api/test-results/report.html
            - artifact pull workflow selenium-web-pom/test-results/report.html
            - artifact pull workflow selenium-api/test-results/report.html
