version: v1.0
name: Python
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2204
blocks:
  - name: Installation
    task:
      jobs:
        - name: Install robot framework dependencies
          commands:
            - sem-version python 3.12
            - checkout
            - python -m pip install --upgrade pip
            - pip install -r selenium-web-pom/requirements.txt
  - name: Run framework
    task:
      jobs:
        - name: Run command
          commands:
            - echo "Test"
            - .\run.bat
