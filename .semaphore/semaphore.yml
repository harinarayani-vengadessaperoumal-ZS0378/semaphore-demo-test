version: v1.0
name: Python
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2204
blocks:
  - name: Installation
    task:
      jobs:
        - name: Install robot framework dependencies
          commands:
            - sem-version python 3.12
            - checkout
            - python -m pip install --upgrade pip
            - pip install -r selenium-web-pom/requirements.txt
            - chmod +x run.sh
            - ./run.sh
      epilogue:
        always:
          commands:
            - touch ./selenium-web-pom/test-results/testfile.txt
            - cp ./selenium-web-pom/test-results/* ./selenium-web-pom/test-results
            - cp ./selenium-api/test-results/* ./selenium-api/test-results
