version: v1.0
name: Python
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2204
blocks:
  - name: Installation
    task:
      jobs:
        - name: Install robot framework dependencies
          commands:
            - sem-version python 3.12
            - checkout
            - python -m pip install --upgrade pip
            - pip install -r selenium-web-pom/requirements.txt
            - ls -l ./run.bat
            - chmod +x ./run.bat
            - ./run.bat
